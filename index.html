
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App | Juveria Mansuri</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">

    <header>
        <h2>☁ Weather<span>Now</span></h2>
        <p>Discover the weather around you</p>
    </header>

    <div class="search-box">
        <input type="text" id="cityInput" placeholder="Enter city name...">
        <button id="searchBtn">Search</button>
    </div>

    <button class="location-btn" id="locationBtn">
        📍 Use My Current Location
    </button>

    <p id="message"></p>

    <div class="weather-card" id="weatherCard">

        <h2 id="city">Mumbai, IN</h2>
        <p id="date">Current Weather</p>

        <div class="weather-main">
            <div class="weather-icon" id="weatherIcon">🌤️</div>
            <h1 id="temperature">--°C</h1>
        </div>

        <h3 id="condition">Search a city</h3>
        <p id="feelsLike">Feels like --°C</p>

        <div class="details">

            <div class="detail-box">
                <span>💧</span>
                <h3 id="humidity">--%</h3>
                <p>Humidity</p>
            </div>

            <div class="detail-box">
                <span>💨</span>
                <h3 id="wind">-- km/h</h3>
                <p>Wind Speed</p>
            </div>

            <div class="detail-box">
                <span>🌡️</span>
                <h3 id="feelsDetail">--°C</h3>
                <p>Feels Like</p>
            </div>

            <div class="detail-box">
                <span>☁️</span>
                <h3 id="clouds">--%</h3>
                <p>Cloud Cover</p>
            </div>

        </div>

    </div>

    <footer>
        <p>Designed by Juveria Mansuri | Task 5</p>
        <p>Powered by Open-Meteo API</p>
    </footer>

</div>

<script src="script.js"></script>
</body>
</html>
